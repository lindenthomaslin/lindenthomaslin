<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Thomas — a curious builder in a little world of code</title>
  <desc id="desc">An original hand-drawn fantasy landscape at dusk, with layered mountains, a forest, a glowing observatory, and drifting fireflies.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#17233C"/>
      <stop offset=".56" stop-color="#4E6675"/>
      <stop offset="1" stop-color="#E89B70"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#FFF4BD"/>
      <stop offset="1" stop-color="#F9B66E"/>
    </linearGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#587B78"/>
      <stop offset="1" stop-color="#355C61"/>
    </linearGradient>
    <linearGradient id="nearHill" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#254C50"/>
      <stop offset="1" stop-color="#142E3A"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop stop-color="#FFE5A5" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFE5A5" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
